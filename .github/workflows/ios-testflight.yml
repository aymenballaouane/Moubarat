# Signature + envoi de l'app iOS vers TestFlight (10/11/2026) — SANS Mac local : tout se fait sur un Mac GitHub.
# Se déclenche UNIQUEMENT quand on pousse une étiquette (tag) « ios-v… » : décision délibérée, jamais sur un push de branche.
#   git tag ios-v1.0.0-1 && git push origin ios-v1.0.0-1
# Secrets requis (Settings › Secrets and variables › Actions) : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (clé « App Store Connect API », rôle Admin). Aucun certificat ni profil n'est stocké : Xcode les crée/renouvelle lui-même
# (signature automatique « gérée dans le cloud ») grâce à la clé API.
# Ce workflow ne SOUMET RIEN à l'examen d'Apple : il dépose seulement la build dans TestFlight (traitement chez Apple ≈ 10-30 min).
name: iOS TestFlight

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEAM_ID: D65XWRYVN7
      BUNDLE_ID: com.moubarat.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.23.0
      - run: pnpm install --frozen-lockfile

      - name: Build de l'app web (contenu embarqué)
        run: pnpm --filter @moubarat/player build
        env:
          VITE_API_BASE_URL: https://api.moubarat.app

      - name: Copier le web dans le projet iOS
        working-directory: apps/ios
        run: npx cap copy ios

      # Apple n'accepte que les builds faites avec un Xcode récent : on prend le plus récent installé sur le Mac.
      - name: Choisir le Xcode le plus récent
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Xcode choisi : $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Déposer la clé App Store Connect (supprimée à la fin)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      # Le Mac GitHub est jetable : le certificat de développement créé à l'exécution précédente a perdu sa clé privée. On supprime ces
      # certificats « Created via API » (jamais ceux de distribution ni ceux des développeurs) pour que Xcode en crée un neuf.
      - name: Nettoyer les anciens certificats de développement créés par l'API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node .github/scripts/asc-clean-dev-certs.mjs "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archiver (signature automatique)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Numéro de build = numéro d'exécution (croissant, exigé par Apple à chaque envoi).
          xcodebuild archive \
            -project apps/ios/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Exporter et envoyer à App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Recopier les erreurs en annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log"; do
            [ -f "$f" ] && grep -E "error:|\*\* .* FAILED|Error Domain|No profiles|requires a development team|Provisioning" "$f" | head -15 | while read -r l; do echo "::error::${l}"; done
          done

      - name: Supprimer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
