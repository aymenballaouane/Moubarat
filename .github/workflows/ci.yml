# Vérification automatique avant chaque mise en ligne (03/11/2026, docs/PASSATION.md §4.17).
# Render ne déploie un commit de master que si cette vérification est verte (`autoDeployTrigger: checksPass`).
name: Vérification

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Les tests de l'API créent des bases éphémères sur un vrai PostgreSQL 16 (apps/api/tests/helpers.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres
      # tools/ui-board télécharge Chromium à l'installation : inutile ici.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Les journaux d'une exécution ne se lisent qu'une fois connecté à GitHub : en cas d'échec, les lignes utiles sont
      # recopiées en annotations (visibles sur la page de l'exécution, sans connexion). Le résultat reste celui de `pnpm test`.
      - name: pnpm test
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "FAIL|AssertionError|Error:|ERR_|Test Files|Tests  " | head -10 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit $code
