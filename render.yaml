# Hébergement Render, région Francfort — LANCEMENT (environ un mois, décision d'Aymen du 03/11/2026),
# avant un hébergeur algérien. Mode d'emploi, vérifications et départ : docs/PASSATION.md §4.17 et §4.18.
# Rien ici n'est propre à Render dans le code : l'API est une image Docker standard (apps/api/Dockerfile),
# la base est un PostgreSQL 16 ordinaire. Les trois fronts (app joueur, CRM, console) sont hébergés sur Vercel
# (un projet par dossier de apps/, vercel.json dans chacun) : ils ne figurent donc PAS ici.
# Les secrets ne sont JAMAIS écrits ici : `sync: false` = Render les demande à la création du Blueprint.

services:
  # ── API ────────────────────────────────────────────────────────────────────────────────────────────
  - type: web
    name: moubarat-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Une seule exécution des migrations par déploiement, AVANT le nouveau code (§4.2), connexion directe.
    preDeployCommand: pnpm --dir /app/apps/api run db:migrate
    # /health : la base répond. Render bascule le trafic AVANT d'envoyer SIGTERM à l'ancienne instance (60 s après),
    # et preDeployCommand a déjà migré : /ready (DRAINING, MIGRATIONS_PENDING) n'apporte rien de plus ici.
    healthCheckPath: /health
    # Doit dépasser SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS (5 s + 20 s).
    maxShutdownDelaySeconds: 40
    # Déploie seulement si la vérification GitHub (.github/workflows/ci.yml) est verte.
    autoDeployTrigger: checksPass
    domains:
      - api.moubarat.app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moubarat-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: INSTANCE_NAME
        value: moubarat-api-1
      - key: CORS_ORIGINS
        value: https://app.moubarat.app,https://crm.moubarat.app,https://admin.moubarat.app,capacitor://localhost
      # Production : jamais le mode dev (sinon aucun SMS ne part, §2.4).
      - key: OTP_DEV_MODE
        value: "false"
      - key: SMS_PROVIDER
        value: smssak
      - key: SMSSAK_API_KEY
        sync: false
      - key: SMSSAK_PROJECT_ID
        sync: false
      - key: SMSSAK_TEMPLATE_ID
        sync: false
      # Au moins un des trois, sinon l'API refuse de démarrer (§3). Un canal laissé vide n'est pas affiché.
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SHUTDOWN_DRAIN_MS
        value: "5000"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "20000"
      # Adresse du client (limites par IP) : mesurée le 05/11/2026 sur le journal de l'API. Render place l'API derrière
      # Cloudflare (adresse de pair vue : 162.158.x.x) puis son réseau privé (10.x). Liste = réseau privé 10.0.0.0/8 +
      # plages IPv4 publiées par Cloudflare (https://www.cloudflare.com/ips-v4, relues le 05/11/2026 — à relire de
      # temps en temps). Vérifié : l'adresse retenue est celle du vrai client, un X-Forwarded-For forgé est ignoré.
      - key: TRUST_PROXY_CIDRS
        value: "10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"

databases:
  - name: moubarat-db
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    databaseName: moubarat
    user: moubarat
    # Aucune connexion depuis Internet : seule l'API (réseau privé de Render) y accède. Pour la copie de départ
    # vers l'hébergeur suivant, ouvrir temporairement UNE adresse (§4.18), puis refermer.
    ipAllowList: []
