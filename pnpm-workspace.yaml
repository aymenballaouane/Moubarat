packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"
allowBuilds:
  # esbuild télécharge son binaire natif à l'installation (requis par tsx et vitest).
  esbuild: true
  # Playwright télécharge Chromium à l'installation (tools/ui-board) — binaire mis en cache
  # une seule fois pour toute la machine (~/AppData/Local/ms-playwright), jamais dans le dépôt.
  playwright: true
# Audit final, MS-009 (12/11/2026) : dépendances transitives de production corrigées (pnpm audit --prod).
# fast-uri (fastify > @fastify/ajv-compiler > ajv) et brace-expansion (exceljs > archiver), versions publiées
# depuis plusieurs semaines. uuid 8 (exceljs) laissé tel quel : l'avis ne vise que v3/v5/v6 avec tampon fourni,
# exceljs n'utilise que v4 — une montée 8 → 11 sous exceljs n'apporterait que du risque.
overrides:
  "fast-uri@>=3.0.0 <4.0.0": "3.1.9"
  "fast-uri@>=4.0.0 <5.0.0": "4.2.3"
  "brace-expansion@<2.0.0": "1.1.21"
  "brace-expansion@>=2.0.0 <3.0.0": "2.1.7"
