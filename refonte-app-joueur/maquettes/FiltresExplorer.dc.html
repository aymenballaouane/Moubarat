<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Moubarat · Filtres Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background: #0A0A0F} a{color:#FFFFFF;text-decoration:none} button{font-family: inherit}</style>
</helmet>
<div style="{{ racine }}">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 0 16px;">
  <a href="Explorer.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(138,148,166,0.16); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></a>
  <button onClick="{{ effacer }}" style="border: 0; background: transparent; padding: 8px 0; cursor: pointer; font-size: 14px; font-weight: 700; color: #F5F7FA;">Tout effacer</button>
</header>
<section style="padding: 18px 16px 0 16px;"><h1 style="margin: 0; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2; color: #F5F7FA; letter-spacing: -0.015em;">Filtres</h1></section>
<section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: #F5F7FA;">Où ?</h2><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ villes }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.st }}">{{ p.t }}</button></sc-for></div></section>
<section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: #F5F7FA;">Quand ?</h2><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ quand }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.st }}">{{ p.t }}</button></sc-for><a href="ChoisirJour.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #F5F7FA; border: 1px solid rgba(138,148,166,0.30);">Choisir un jour</a></div></section>
<section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: #F5F7FA;">Quel sport ?</h2><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ sports }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.st }}">{{ p.t }}</button></sc-for></div></section>
<section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: #F5F7FA;">Quel niveau ?</h2><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ niveaux }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.st }}">{{ p.t }}</button></sc-for></div></section>
<sc-if value="{{ voitFormats }}" hint-placeholder-val="{{ true }}"><section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: #F5F7FA;">Quel format ?</h2><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ formats }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.st }}">{{ p.t }}</button></sc-for></div></section></sc-if>
<section style="padding: 22px 16px 0 16px;"><button onClick="{{ basculer }}" role="switch" aria-checked="{{ place }}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #131A24; border: 1px solid rgba(138,148,166,0.16); cursor: pointer; text-align: left;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">Seulement les matchs avec de la place</span><span style="{{ piste }}"><span style="{{ bouton }}"></span></span></button></section>
<footer style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 16px 22px 16px; background: rgba(10,10,15,0.96); border-top: 1px solid rgba(138,148,166,0.16);"><a href="Explorer.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border: 0; border-radius: 12px; background: #FF2B00; color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; cursor: pointer; text-decoration: none; font-weight: 600;">Voir les matchs</a></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":910}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ville: 'Alger', quand: 'Aujourd’hui', sport: 'Tous', niveaux: [], formats: [], place: false }; }
  renderVals() {
    const S = this.state;
    const un = (cle, liste) => liste.map(t => ({ t, on: String(S[cle] === t), st: S[cle] === t ? 'display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; background: rgba(255,43,0,0.14); color: #FF6A4D; border: 1px solid rgba(255,43,0,0.45);' : 'display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #F5F7FA; border: 1px solid rgba(138,148,166,0.30);', pick: () => this.setState({ [cle]: t }) }));
    const plusieurs = (cle, liste) => liste.map(t => { const on = S[cle].indexOf(t) !== -1; return { t, on: String(on), st: on ? 'display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; background: rgba(255,43,0,0.14); color: #FF6A4D; border: 1px solid rgba(255,43,0,0.45);' : 'display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #F5F7FA; border: 1px solid rgba(138,148,166,0.30);', pick: () => this.setState({ [cle]: on ? S[cle].filter(x => x !== t) : S[cle].concat([t]) }) }; });
    const voitFormats = S.sport !== 'Padel';
    return {
      villes: un('ville', ['Alger', 'Oran', 'Constantine', 'Annaba', 'Blida', 'Sétif', 'Autre ville']),
      quand: un('quand', ['Aujourd’hui', 'Ce soir', 'Demain', 'Ce week-end']),
      sports: un('sport', ['Tous', 'Foot', 'Padel']),
      niveaux: plusieurs('niveaux', ['Loisir', 'Intermédiaire', 'Compétition']),
      formats: plusieurs('formats', ['5v5', '6v6', '7v7', '8v8', '11v11']), voitFormats,
      place: String(S.place),
      piste: 'position: relative; flex: 0 0 52px; width: 52px; height: 30px; border-radius: 999px; background: ' + (S.place ? '#00C896' : '#1C2533') + ';',
      bouton: 'position: absolute; top: 3px; ' + (S.place ? 'right: 3px;' : 'left: 3px;') + ' width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF;',
      basculer: () => this.setState({ place: !S.place }),
      effacer: () => this.setState({ ville: 'Alger', quand: 'Aujourd’hui', sport: 'Tous', niveaux: [], formats: [], place: false }),
      racine: 'position: relative; width: 390px; height: ' + (voitFormats ? 910 : 830) + 'px; overflow: hidden; background: #0A0A0F; color: #8A94A6; font-family: \'Inter\', system-ui, sans-serif; font-size: 15px; line-height: 1.5;'
    };
  }
}
</script>
</body>
</html>
