<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Moubarat · موافقاتك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;family=Changa:wght@600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background: #0A0A0F} a{color:#FFFFFF;text-decoration:none}</style>
</helmet>
<div dir="rtl" lang="ar" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0F; color: #8A94A6; font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
  <header style="display: flex; align-items: center; padding: 20px 16px 0 16px;">
    <a href="NoticeDonneesAr.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(138,148,166,0.16); display: grid; place-items: center;"><svg style="transform: scaleX(-1);" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,18 9,12 15,6"></polyline></svg></a>
  </header>
  <section style="padding: 22px 16px 0 16px; text-align: center;">
    <h1 style="margin: 0; font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2; color: #F5F7FA; ">موافقاتك</h1>
  </section>
  <section style="padding: 24px 16px 0 16px;">
    <div style="border-radius: 12px; background: #131A24; border: 1px solid rgba(138,148,166,0.16); overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">شروط الاستخدام والخصوصية</span></span>
        <span style="font-size: 12px; font-weight: 700; color: #F5F7FA;">إلزامي</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">عمري 18 سنة أو أكثر</span></span>
        <span style="font-size: 12px; font-weight: 700; color: #F5F7FA;">إلزامي</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">رقمي ظاهر للعب</span><span style="font-size: 13px; line-height: 1.4; color: #F5F7FA;">{{ telTexte }}</span></span>
        <button role="switch" aria-label="رقمي ظاهر للعب" aria-checked="{{ on_tel }}" onClick="{{ t_tel }}" style="{{ s_tel }}"><span style="{{ k_tel }}"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; ">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">عروض المراكز القريبة مني</span></span>
        <button role="switch" aria-label="عروض المراكز القريبة مني" aria-checked="{{ on_promo }}" onClick="{{ t_promo }}" style="{{ s_promo }}"><span style="{{ k_promo }}"></span></button>
      </div>
    </div>
  </section>
  <section style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; font-size: 14px; line-height: 1.45; text-align: center; color: #F5F7FA;">تريد التوقف عن كل شيء؟ يمكنك حذف حسابك: سيُمحى اسمك ورقمك.</p>
    <a href="ConfSupprimerCompteAr.dc.html" style="text-align: center; font-size: 14px; font-weight: 700; color: #FF8A7A; text-decoration: underline; text-underline-offset: 3px;">حذف حسابي</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tel: true, promo: false }; }
  renderVals() {
    const v = {};
    for (const k of ['tel', 'promo']) {
      const on = this.state[k];
      v['on_' + k] = on ? 'true' : 'false';
      v['t_' + k] = () => this.setState({ [k]: !this.state[k] });
      v['s_' + k] = 'position: relative; flex: 0 0 52px; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 999px; cursor: pointer; background: ' + (on ? '#00C896' : 'rgba(138,148,166,0.30)') + ';';
      v['k_' + k] = 'position: absolute; top: 3px; ' + (on ? 'left: 3px; background: #FFFFFF;' : 'right: 3px; background: #FFFFFF;') + ' width: 24px; height: 24px; border-radius: 999px;';
    }
    v.telTexte = this.state.tel ? 'لمنظّم المباريات التي تنضم إليها، ولاعبي المباريات التي تنظّمها، وللمراكز التي تحجز فيها. بدونه، يمكنك المشاهدة فقط.' : 'تم سحب الموافقة. تبقى تسجيلاتك وحجوزاتك الحالية، ويبقى رقمك ظاهرًا فيها. لتنضم إلى مباراة جديدة أو تحجز، فعّلها من جديد.';
    return v;
  }
}
</script>
</body>
</html>
