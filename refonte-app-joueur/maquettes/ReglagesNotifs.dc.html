<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Moubarat · Réglages des notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background: #0A0A0F} a{color:#FFFFFF;text-decoration:none}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0F; color: #8A94A6; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 0 16px;"><a href="Profil.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(138,148,166,0.16); display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,18 9,12 15,6"></polyline></svg></a></header><section style="padding: 14px 16px 0 16px;"><h1 style="margin: 0; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2; color: #F5F7FA; text-align: center; letter-spacing: -0.015em;">Notifications</h1></section><section style="padding: 22px 16px 0 16px;"><div style="border-radius: 12px; background: #131A24; border: 1px solid rgba(138,148,166,0.16); overflow: hidden;"><div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);"><span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">Une place se libère dans ta ville</span></span><button role="switch" aria-checked="{{ on_place }}" aria-label="Une place se libère près de chez toi" onClick="{{ t_place }}" style="{{ s_place }}"><span style="{{ k_place }}"></span></button></div><div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);"><span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">Rappel avant tes matchs</span></span><button role="switch" aria-checked="{{ on_rappel }}" aria-label="Rappel avant tes matchs" onClick="{{ t_rappel }}" style="{{ s_rappel }}"><span style="{{ k_rappel }}"></span></button></div><div style="display: flex; align-items: center; gap: 14px; padding: 16px 14px; border-bottom: 1px solid rgba(138,148,166,0.16);"><span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #F5F7FA;">Les bons plans des centres</span></span><button role="switch" aria-checked="{{ on_promo }}" aria-label="Les bons plans des centres" onClick="{{ t_promo }}" style="{{ s_promo }}"><span style="{{ k_promo }}"></span></button></div></div></section><p style="margin: 0; padding: 14px 24px 0 24px; font-size: 13px; line-height: 1.45; text-align: center; color: #F5F7FA;">Ce qui touche à tes matchs et à tes réservations (une confirmation, une annulation, un joueur qui arrive ou qui part, un centre qui réserve à ton numéro), on te le dit toujours.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { place: true, rappel: true, tel: true, promo: false }; }
  renderVals() {
    const v = {};
    for (const k of ["place", "rappel", "promo"]) {
      const on = this.state[k];
      v['on_' + k] = on ? 'true' : 'false';
      v['t_' + k] = () => this.setState({ [k]: !this.state[k] });
      v['s_' + k] = 'position: relative; flex: 0 0 52px; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 999px; cursor: pointer; background: ' + (on ? '#00C896' : 'rgba(138,148,166,0.30)') + ';';
      v['k_' + k] = 'position: absolute; top: 3px; ' + (on ? 'right: 3px; background: #FFFFFF;' : 'left: 3px; background: #FFFFFF;') + ' width: 24px; height: 24px; border-radius: 999px;';
    }
    return v;
  }
}
</script>
</body>
</html>
