<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Moubarat · اختر يومًا</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;family=Changa:wght@600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background: #0A0A0F} a{color:#FFFFFF;text-decoration:none} button{font-family: inherit}</style>
</helmet>
<div dir="rtl" lang="ar" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0F; color: #8A94A6; font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"><dc-import name="FiltresExplorerAr" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.66);"></div>
<div style="position: absolute; right: 0; left: 0; bottom: 0; padding: 12px 16px 26px 16px; border-radius: 20px 20px 0 0; background: #131A24; border-top: 1px solid rgba(138,148,166,0.16); display: flex; flex-direction: column; gap: 14px;">
  <span style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: rgba(138,148,166,0.35);"></span>
  <a href="FiltresExplorerAr.dc.html" aria-label="إغلاق" style="position: absolute; top: 14px; left: 16px; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(138,148,166,0.30); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></a>
  <span style="font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 22px; line-height: 1.2; text-align: center; color: #F5F7FA; font-weight: 700; ">اختر يومًا</span>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
    <button onClick="{{ moisAvant }}" aria-label="الشهر السابق" style="{{ stAvant }}"><svg style="transform: scaleX(-1);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,18 9,12 15,6"></polyline></svg></button>
    <span style="font-size: 16px; font-weight: 700; color: #F5F7FA;">{{ moisNom }}</span>
    <button onClick="{{ moisApres }}" aria-label="الشهر التالي" style="{{ stApres }}"><svg style="transform: scaleX(-1);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9,6 15,12 9,18"></polyline></svg></button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{ semaine }}" as="j" hint-placeholder-count="7"><span style="text-align: center; font-size: 12px; font-weight: 700; color: #8A94A6;">{{ j }}</span></sc-for>
    <sc-for list="{{ cases }}" as="c" hint-placeholder-count="35">
      <sc-if value="{{ c.vide }}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
      <sc-if value="{{ c.passe }}" hint-placeholder-val="{{ false }}"><span style="height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #5B6475;">{{ c.n }}</span></sc-if>
      <sc-if value="{{ c.libre }}" hint-placeholder-val="{{ true }}"><button onClick="{{ c.pick }}" aria-label="{{ c.aria }}" aria-pressed="{{ c.on }}" style="{{ c.st }}">{{ c.n }}<sc-if value="{{ c.point }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; bottom: 7px; right: 50%; width: 4px; height: 4px; margin-right: -2px; border-radius: 999px; background: {{ c.pointCoul }};"></span></sc-if></button></sc-if>
    </sc-for>
  </div>
  <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #8A94A6;"><span style="width: 4px; height: 4px; border-radius: 999px; background: #F5F7FA;"></span>مباريات في هذا اليوم</p>
  <a href="FiltresExplorerAr.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border: 0; border-radius: 12px; background: #FF2B00; color: #FFFFFF; font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px; cursor: pointer; text-decoration: none; font-weight: 600;">{{ choixLabel }}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mois: 0, jour: [0, 24] }; }
  renderVals() {
    const S = this.state;
    const MOIS = [{ nom: 'أكتوبر 2026', mot: 'أكتوبر', debut: 3, jours: 31, avec: [20, 21, 22, 23, 24, 25, 27, 28, 30, 31] }, { nom: 'نوفمبر 2026', mot: 'نوفمبر', debut: 6, jours: 30, avec: [1, 3, 4, 6, 7, 8, 10, 13, 14, 15] }];
    const JOURS = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
    const M = MOIS[S.mois];
    const cases = [];
    for (let k = 0; k < M.debut; k++) cases.push({ vide: true, passe: false, libre: false });
    for (let d = 1; d <= M.jours; d++) {
      const passe = S.mois === 0 && d < 20, on = S.jour[0] === S.mois && S.jour[1] === d, point = M.avec.indexOf(d) !== -1;
      cases.push({ vide: false, passe, libre: !passe, n: String(d), on: String(on), point, pointCoul: '#F5F7FA',
        aria: JOURS[(M.debut + d - 1) % 7] + ' ' + d + ' ' + M.mot + (point ? '، فيه مباريات' : ''),
        pick: () => this.setState({ jour: [S.mois, d] }),
        st: 'position: relative; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 700; cursor: pointer; ' + (on ? 'background: linear-gradient(180deg, #1C2533 0%, #131A24 100%); color: #FFFFFF; border: 1px solid rgba(255,43,0,0.40); box-shadow: 0 0 0 1px rgba(255,43,0,0.10), 0 8px 24px rgba(255,43,0,0.24), inset 0 -2px 0 #FF2B00;' : 'background: transparent; color: #F5F7FA; border: 1px solid transparent;') });
    }
    const J = MOIS[S.jour[0]], dj = S.jour[1];
    const rond = (actif) => 'width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(138,148,166,' + (actif ? '0.30' : '0.16') + '); background: transparent; display: grid; place-items: center; padding: 0; cursor: ' + (actif ? 'pointer' : 'default') + '; opacity: ' + (actif ? '1' : '0.35') + ';';
    return {
      semaine: ['ن', 'ث', 'ر', 'خ', 'ج', 'س', 'ح'], cases, moisNom: M.nom,
      moisAvant: () => S.mois > 0 && this.setState({ mois: S.mois - 1 }), moisApres: () => S.mois < 1 && this.setState({ mois: S.mois + 1 }),
      stAvant: rond(S.mois > 0), stApres: rond(S.mois < 1),
      choixLabel: JOURS[(J.debut + dj - 1) % 7] + ' ' + dj + ' ' + J.mot
    };
  }
}
</script>
</body>
</html>
